<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourTune - Web Player: Music of Your Choice</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">
    <link rel="icon" href="https://open.spotifycdn.com/cdn/images/favicon32.b64ecc03.png" type="image/x-icon">
</head>
<body>

    <!-- container -->

    <div class="container flex bg-black">


        <!-- left side -->

        <div class="left">

            <!-- home and search box -->
            <div class="close invert"><img src="img/close.svg" alt=""></div>
            <div class="home bg-grey rounded box">
                <div class="logo"><img class="invert" style="size: 15px;" src="img/logo.svg" alt="spotify"><b>Spotify</b></div>
                <ul>
                    <li><img class="invert" src="img/home.svg" alt="Home">Home</li>
                    <li><img class="invert" src="img/search.svg" alt="Search">Search</li>
                </ul>
            </div>

            <!-- end of the home -->

            <!-- your library  -->

            <div class="library bg-grey rounded box">

                <div class="yourlibrary" style="font-weight: 800; font-size: medium;">
                    <div class="yl"><img class="invert" src="img/yourlibrary.svg" alt=""><div class="yourlib"> Your Library</div></div>
                    <div class="plus"><img class="invert" src="img/plus.svg" alt=""></div>
                </div>

                <div class="songs_list" style="color: white;">
                    <ul>
                        <li>
                        </li>
                    </ul>
                </div>

            </div>

            <!-- end of the library -->

            <!-- footer -->

            <div class="footer">
                 <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
            </div>

            <!-- end of footer -->

        </div>

        <!-- end of left side -->

        <!-- right hand side -->

        <div class="right bg-grey rounded box1 ">

            <!-- header -->

            <div class="header">

                <div class="nav flex">
                    <div class="hamburger"><img src="img/hamburger.svg" alt=""></div>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor"         fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18" />
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" />
                    </svg>
                </div>

                <div class="buttons">
                    <button class="signupbtn">Sign Up</button>
                    <button class="loginbtn">Log In</button>
                </div>

            </div>

            <!-- end of header -->

            <!-- spotify playlist -->

            <div class="spotify_playlist rounded">

                <h2 style="margin-bottom: 15px; padding-left: 10px;">Spotify Playlist</h2>

                <!-- card container -->

                <div class="card-container"></div>

                <!-- end of card container -->

                <!-- playbar -->

                <div class="playbar">

                    <div class="playbarinfo">

                    <div class="songinfo"></div>

                    <div class="buttonsinfo">

                        <!-- left music -->
                        <div id="previous"><img src="img/previous.svg" alt=""></div>
                        <!-- playbutton -->
                        <div id="play"><img src="img/play.svg" alt=""></div>
                        <!-- right music -->
                        <div id="next"><img src="img/next.svg" alt=""></div>

                    </div>
                    
                    
                    <div class="songtime"></div>

                    <div class="vol"><img style="margin-bottom: 8px;" src="img/vol.svg" alt="">
                        <div class="range">
                            <input type="range" name="volume" id="volume">
                        </div>
                    </div>

                    </div>
                

                    <div class="seekbar">
                        <div class="circle">
                            
                        </div>
                    </div>

                </div>

                <!-- end: playbar -->

            </div>

            <!-- end of spotify playlist -->

        </div>

        <!-- end of right side -->


    </div>

    <!-- end of container -->

    <script src="js/script.js"></script>

</body>
</html>
